<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西园寺档案局</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Noto+Serif+SC:wght@400;600;700;900&display=swap');:root{--red:#bd2845;--ink:#37202a;--gold:#f4bd50;--paper:#fff8ed;--line:#ebcbae}*{box-sizing:border-box}body{margin:0;background:#ffe9d7;background-image:radial-gradient(#ecc5ae 1px,transparent 1px);background-size:19px 19px;color:var(--ink);font-family:"Noto Serif SC",serif;min-width:1000px}.top{height:74px;padding:0 48px;background:var(--paper);border-bottom:4px solid var(--red);display:flex;align-items:center;justify-content:space-between}.brand b{font-size:20px;letter-spacing:3px}.brand small{display:block;color:#987b71;font:10px "DM Mono";letter-spacing:2px}.shell{width:1170px;margin:33px auto}.steps{display:flex;justify-content:center;gap:22px;margin:0 0 22px}.steps span{font-size:12px;color:#9d8179}.steps b{display:inline-grid;place-items:center;width:25px;height:25px;border:1px solid #d9b9ad;border-radius:50%;font:12px "DM Mono"}.steps .on{color:var(--red);font-weight:700}.steps .on b{background:var(--red);color:white;border-color:var(--red);box-shadow:3px 3px var(--gold)}.screen{display:none;min-height:600px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:8px 9px #b2374218;overflow:hidden}.screen.on{display:grid}.two{grid-template-columns:1fr 1fr}.left{padding:46px 55px;background:#ffe0af}.right{padding:46px 55px}.eyebrow{font:11px "DM Mono";color:var(--red);letter-spacing:2px}h1{font-size:34px;margin:9px 0}h2{font-size:28px;margin:8px 0}p{color:#886d65;line-height:1.8;font-size:13px}.field{margin:16px 0}.field label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:8px}.field input,.field select,.search{width:100%;padding:11px;border:1px solid #e8c8ae;border-radius:7px;background:white;font:13px "Noto Serif SC"}.ageout{font:700 25px "DM Mono";color:var(--red)}input[type=range]{padding:0;accent-color:var(--red)}.btn{margin-top:16px;background:var(--red);color:white;border:0;border-radius:7px;padding:12px 18px;font:700 13px "Noto Serif SC";cursor:pointer;box-shadow:4px 4px var(--gold)}.portrait{display:grid;place-items:center;font:900 170px "DM Mono";color:#c64751;background:radial-gradient(circle,#fff1c8 0 36%,transparent 37%);min-height:600px}.modes{display:flex;gap:7px;margin:13px 0}.modes button{flex:1;padding:8px;border:1px solid #e5b45c;background:#fff8e9;border-radius:6px;cursor:pointer}.modes button.on{background:var(--red);color:white}.dicegrid,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.diegroup,.stat{border:1px solid #ecc789;border-radius:8px;background:#fff9ea;padding:9px}.diegroup b,.stat b{font-size:11px}.diegroup small,.stat small{display:block;color:#9b776c;font:10px "DM Mono";margin:4px 0}.dice{display:flex;gap:4px;margin-top:8px}.die{width:25px;height:25px;border:1px solid #d9514d;border-radius:5px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px;background:white}.pip{width:5px;height:5px;background:#bb2843;border-radius:50%;align-self:center;justify-self:center}.attempts{margin:15px 0;text-align:center}.attempt{display:inline-grid;place-items:center;width:26px;height:26px;margin:0 3px;background:#fff;border:1px solid #d66a59;border-radius:6px}.attempt.used{background:#d8aba0;color:#f4d8c6}.manual{display:none}.manual.on{display:block}.budget{font:700 34px "DM Mono";color:#9c263b;text-align:center;padding:24px;background:#fff5d7;border-radius:9px}.records{height:78px;border:1px solid #ead0b9;border-radius:8px;padding:12px;margin:15px 0;display:flex;gap:9px;align-items:center}.record{width:36px;height:36px;border-radius:50%;border:1px solid #d16a57;background:white;color:#8f273c;font:700 13px "DM Mono";cursor:pointer}.record.on{background:#ffe2a4;border-color:#d89d2c}.stat span{display:block;font:700 28px "DM Mono";color:#98233b}.stat input{width:100%;border:0;border-bottom:2px solid #f2ce76;font:700 25px "DM Mono";color:#98233b;background:transparent}.bar{height:9px;background:#e7d6c6;border-radius:99px;margin-top:9px}.bar i{display:block;width:100%;height:100%;border-radius:inherit}.san i{background:#8754a3}.mp i{background:#378fba}.hp i{background:#d94c59}.jobleft{padding:38px 32px;background:#ffe0af;display:flex;flex-direction:column}.jobscroll{overflow:auto;max-height:425px;margin-top:10px;padding-right:5px}.jobtable{width:100%;border-collapse:separate;border-spacing:0 6px}.jobtable th{text-align:left;font:10px "DM Mono";color:#8d6b61;padding:4px}.jobtable td{padding:8px;background:#fff9ed;border-top:1px solid #edc984;border-bottom:1px solid #edc984;font-size:12px;cursor:pointer}.jobtable td:first-child{border-left:1px solid #edc984;border-radius:7px 0 0 7px}.jobtable td:last-child{border-right:1px solid #edc984;border-radius:0 7px 7px 0}.jobtable tr.on td{background:var(--red);color:white;border-color:var(--red)}.jobright{padding:42px 46px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.metrics div{background:#fff0cc;border-radius:8px;padding:10px;min-height:80px}.metrics small{display:block;color:#987466;font-size:10px}.metrics b{display:block;margin-top:8px;color:#8e233a;font:700 15px "DM Mono"}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips span{padding:5px 8px;border:1px solid #ead0b8;border-radius:99px;background:#fffaf1;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#315c55;color:white;border-radius:99px;padding:10px 16px;opacity:0;transition:.2s}.toast.on{opacity:1}</style><style>
.luck-roll{margin-top:12px;padding:11px;border:1px solid #dca85d;border-radius:8px;background:#fff3ce}.luck-roll small{display:block;margin:3px 0 7px;color:#9b776c;font:10px "DM Mono"}.luck-roll .dice{margin:8px 0}.luck-roll button,.age-luck button,.fix-card button{border:1px solid #c9434d;border-radius:6px;padding:6px 10px;background:#fff9ea;color:#9a2036;font:700 12px "Noto Serif SC";cursor:pointer}.luck-roll span{display:inline-block;margin-left:8px;color:#7a4346}.age-luck-side{background:#fff2cc!important;min-height:600px!important;padding:25px!important;display:flex!important;align-items:center;justify-content:center}.age-luck{max-width:300px;text-align:center}.age-luck h2{margin:8px 0}.age-luck .dice{justify-content:center;margin:18px 0}.age-luck .die{width:42px;height:42px;padding:7px}.age-luck .pip{width:8px;height:8px}.age-luck p{color:#795d58;line-height:1.7}.final-avatar{position:relative;width:310px;height:390px;display:grid;place-items:center}.final-avatar:before{content:"";position:absolute;width:118px;height:126px;top:45px;border-radius:50% 50% 45% 45%;background:var(--age-ink,#c64751)}.final-avatar:after{content:"";position:absolute;width:260px;height:185px;bottom:15px;border-radius:55% 55% 12% 12%;background:var(--age-ink,#c64751)}.final-avatar span{z-index:1;position:relative;top:40px;color:#fff8e9;font:900 96px "DM Mono";line-height:1}.fix-card{margin:9px 0;padding:12px;border:1px solid #ecd1ad;border-radius:8px;background:#fff9ed;line-height:1.85}.fix-card input{width:48px;padding:3px 5px;margin:0 3px}.fixlog{display:block;margin-top:7px;color:#815251;font-size:12px}.derived-final{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:9px;margin:13px 0}.derived-final>div{padding:12px;border-radius:8px;background:#ffe5a7}.derived-final small{display:block;color:#8c6056}.derived-final b{display:block;margin:5px 0;color:#9b203a;font:700 21px "DM Mono"}.derived-final .bar{height:8px;border-radius:9px;background:#f6d39c;overflow:hidden}.derived-final .bar i{display:block;width:100%;height:100%;background:#c44350}.derived-final .bar.mp i{background:#6265a6}.derived-final .bar.hp i{background:#bf5f4e}.final-grid{margin-top:13px}

</style><style>

</style></head><body><header class="top"><div class="brand"><b>✦ 西园寺档案局</b><small>COC 7E · INVESTIGATOR CREATION</small></div><span>草稿自动保存</span></header><main class="shell"><nav class="steps"><span class="on" id="n1"><b>1</b> 角色概念</span><span id="n2"><b>2</b> 基础属性</span><span id="n3"><b>3</b> 衍生数值</span><span id="n4"><b>4</b> 职业与技能</span></nav><section class="screen two on" id="s1"><div class="right"><span class="eyebrow">STEP 01</span><h1>你的调查员是谁？</h1><p>年龄为必填项，其他资料可以之后补充。</p><div class="field"><label>年龄 <span class="ageout" id="ageout">27</span></label><input id="age" type="range" min="15" max="90" value="27"></div><div class="field"><label>姓名 <small>可稍后填写</small></label><input id="name" placeholder="例如：米莉斯·布莱克"></div><div class="profile-grid"><div class="field"><label>性别</label><select id="gender"><option value="">暂不填写</option><option>女</option><option>男</option><option>非二元</option></select></div><div class="field"><label>国籍</label><input id="nationality" placeholder="例如：中国"></div><div class="field"><label>故乡</label><input id="hometown" placeholder="例如：阿卡姆"></div><div class="field"><label>住地</label><input id="residence" placeholder="例如：上海"></div><div class="field"><label>时代</label><input id="era" placeholder="例如：1920 年代"></div><div class="field"><label>玩家</label><input id="player" placeholder="可稍后填写"></div></div><button class="btn" onclick="go(2)">进入属性 →</button></div><div class="portrait person" id="agePortrait"><div class="avatar-halo"></div><div class="avatar-figure" aria-label="调查员未定头像"><div class="avatar-body"></div><div class="avatar-neck"></div><div class="avatar-head"></div><div class="avatar-question">?</div></div><div class="portrait-age">AGE · <span id="portraitAge">27</span></div></div></section><section class="screen two" id="s2"><div class="left"><span class="eyebrow">STEP 02</span><h2>基础属性</h2><div class="modes"><button class="on" id="autoBtn">掷骰生成</button><button id="manualBtn">自主填写</button></div><div id="auto"><p>24 枚 D6 会按规则分为 9 组。</p><div class="chance-row">KP 规定的掷骰机会 <select id="chance"><option value="5">5 次</option><option value="7">7 次</option></select></div><div class="dicegrid" id="dicegrid"></div><div class="attempts" id="attempts"></div><button class="btn" id="roll">掷下 24 枚骰子</button></div><div class="manual" id="manual"><p>输入 KP 规定的总点数，并选择是否包含幸运。</p><input id="budget" type="number" placeholder="属性总点数上限"><select id="inc"><option value="1">包含幸运</option><option value="0">不含幸运</option></select><div class="budget" id="remain">—</div></div><div class="insight-panel"><div id="insights"></div><svg id="radar" viewBox="0 0 240 230"></svg></div></div><div class="right"><span class="eyebrow">ATTRIBUTE RECORD</span><h2>属性记录</h2><div class="records" id="records">尚未生成记录</div><div class="stats" id="stats"></div><button class="btn" id="confirm">确认属性 →</button></div></section><section class="screen two" id="s3"><div class="portrait">?</div><div class="right"><span class="eyebrow">ATTRIBUTE FINALIZATION</span><h1>衍生数值</h1><p id="agefix"></p><div class="stats" id="derived"></div><button class="btn" onclick="go(4)">选择职业 →</button></div></section><section class="screen two" id="s4"><div class="jobleft"><span class="eyebrow">STEP 04 · OCCUPATION</span><h2>选择职业</h2><input class="search" id="search" placeholder="搜索编号或职业名称"><div class="jobscroll"><table class="jobtable"><thead><tr><th>#</th><th>职业</th><th>信誉</th><th>点数</th></tr></thead><tbody id="jobrows"></tbody></table></div></div><div class="jobright" id="jobdetail"></div></section></main><div class="toast" id="toast"></div><script src="professions.js"></script><script>const A=[['str','力量','STR','3D6×5',3],['con','体质','CON','3D6×5',3],['siz','体型','SIZ','(2D6+6)×5',2],['dex','敏捷','DEX','3D6×5',3],['app','外貌','APP','3D6×5',3],['int','智力','INT','(2D6+6)×5',2],['pow','意志','POW','3D6×5',3],['edu','教育','EDU','(2D6+6)×5',2],['luck','幸运','LUCK','3D6×5',3]],spot={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};let vals={},records=[],active=-1,tries=5,chance=5,manual=false,job=0;const $=x=>document.querySelector(x),d6=()=>1+Math.floor(Math.random()*6);function go(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.steps span').forEach(x=>x.classList.remove('on'));$('#s'+n).classList.add('on');$('#n'+n).classList.add('on');if(n===3)final();if(n===4)jobs()}drawDice();drawStats();age.oninput=updatePortrait;function updatePortrait(){let a=+age.value;ageout.textContent=a;let r=Math.max(91,223-a*1.3),g=Math.max(27,86-a*.54),b=Math.max(38,91-a*.45);let p=document.querySelector('#agePortrait');if(p){p.style.setProperty('--age-ink','rgb('+r+','+g+','+b+')');document.querySelector('#portraitAge').textContent=a}}updatePortrait();function die(n){return '<i class="die">'+spot[n].map(x=>'<b class="pip" style="grid-area:'+Math.ceil(x/3)+'/'+((x-1)%3+1)+'"></b>').join('')+'</i>'}function drawDice(){dicegrid.innerHTML=A.map(a=>'<div class="diegroup"><b>'+a[1]+'/'+a[2]+'</b><small>'+a[3]+'</small><div class="dice">'+(vals[a[0]]?vals[a[0]].dice.map(die).join(''):Array(a[4]).fill('<i class="die"></i>').join(''))+'</div></div>').join('');attempts.innerHTML=Array.from({length:chance},(_,i)=>'<i class="attempt '+(i>=tries?'used':'')+'">⚄</i>').join('')}function rollAll(){if(!tries)return;vals={};A.forEach(a=>{let ds=Array.from({length:a[4]},d6);vals[a[0]]={dice:ds,value:(ds.reduce((x,y)=>x+y,0)+(a[4]===2?6:0))*5}});records.push(JSON.parse(JSON.stringify(vals)));active=records.length-1;tries--;drawDice();drawStats();drawRecords()}function drawStats(){document.querySelector('#stats').innerHTML=A.map(a=>'<div class="stat"><b>'+a[1]+'/'+a[2]+'</b><small>'+a[3]+'</small>'+ (manual?'<input data-k="'+a[0]+'" value="'+(vals[a[0]]?.value??'')+'">':'<span>'+(vals[a[0]]?vals[a[0]].value:'—')+'</span>')+'</div>').join('');if(manual)document.querySelector('#stats').querySelectorAll('input').forEach(x=>x.oninput=manualCalc)}function drawRecords(){document.querySelector('#records').innerHTML=records.map((_,i)=>'<button class="record '+(i===active?'on':'')+'" onclick="pick('+i+')">'+(i+1)+'</button>').join('')}function pick(i){active=i;vals=JSON.parse(JSON.stringify(records[i]));drawDice();drawStats();drawRecords()}function manualCalc(){vals={};document.querySelector('#stats').querySelectorAll('input').forEach(x=>vals[x.dataset.k]={value:+x.value||0,dice:[]});let sum=A.reduce((n,a)=>n+((inc.value==='1'||a[0]!=='luck')?vals[a[0]].value:0),0);document.querySelector('#remain').textContent=budget.value?(+budget.value-sum):'—'}autoBtn.onclick=()=>{manual=false;autoBtn.classList.add('on');manualBtn.classList.remove('on');document.querySelector('#auto').style.display='block';document.querySelector('#manual').classList.remove('on');document.querySelector('#records').style.display='flex';drawStats()};manualBtn.onclick=()=>{manual=true;manualBtn.classList.add('on');autoBtn.classList.remove('on');document.querySelector('#auto').style.display='none';document.querySelector('#manual').classList.add('on');document.querySelector('#records').style.display='none';vals={};drawStats();manualCalc()};document.querySelector('#roll').onclick=rollAll;document.querySelector('#chance').onchange=e=>{chance=+e.target.value;tries=chance;vals={};records=[];active=-1;drawDice();drawStats();drawRecords()};document.querySelector('#confirm').onclick=()=>{if(!Object.keys(vals).length)return;localStorage.setItem('final',JSON.stringify(vals));go(3)};function final(){let v=JSON.parse(localStorage.getItem('final')||'{}'),hp=Math.floor((v.con.value+v.siz.value)/10),mp=Math.floor(v.pow.value/5);agefix.textContent='';derived.innerHTML='<div class="stat san"><b>SAN</b><span>'+v.pow.value+'/'+v.pow.value+'</span><div class="bar"><i></i></div></div><div class="stat mp"><b>MP</b><span>'+mp+'/'+mp+'</span><div class="bar"><i></i></div></div><div class="stat hp"><b>HP</b><span>'+hp+'/'+hp+'</span><div class="bar"><i></i></div></div><div class="stat"><b>DB / 体格</b><span>'+((v.str.value+v.siz.value)>=125?'+1D4 / 1':'0 / 0')+'</span></div><div class="stat"><b>MOV</b><span>8</span></div>'}function point(f,v){if(f.includes('教育×4'))return v.edu.value*4;let x=f.includes('敏捷')?v.dex.value:f.includes('外貌')?v.app.value:f.includes('意志')?v.pow.value:f.includes('力量')?v.str.value:v.con.value;return f.includes('教育×2')?v.edu.value*2+x*2:'—'}function jobs(){let v=JSON.parse(localStorage.getItem('final')||'{}');function draw(q=''){let list=PROFESSIONS.filter(j=>(j.name+j.id).includes(q));jobrows.innerHTML=list.map(j=>'<tr class="'+(j.id===PROFESSIONS[job].id?'on':'')+'" onclick="choose('+j.id+')"><td>'+j.id+'</td><td>'+j.name+'</td><td>'+j.creditMin+'–'+j.creditMax+'</td><td>'+point(j.formula,v)+'</td></tr>').join('');let j=PROFESSIONS[job],chips=j.skills.split('，').filter(Boolean);jobdetail.innerHTML='<span class="eyebrow">OCCUPATION PROFILE</span><h1>'+j.id+' · '+j.name+'</h1><div class="metrics"><div><small>信誉范围</small><b>'+j.creditMin+'–'+j.creditMax+'</b></div><div><small>职业属性点</small><b>'+j.formula+'</b></div><div><small>当前可用点数</small><b>'+point(j.formula,v)+'</b></div></div><h2>本职技能</h2><div class="chips">'+chips.map(x=>'<span>'+x+'</span>').join('')+'</div><p>'+j.skills+'</p>'}window.choose=id=>{job=PROFESSIONS.findIndex(j=>j.id===id);draw(search.value)};search.oninput=()=>draw(search.value);draw()}</script><style>.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field label small{font-weight:400;color:#a88779;font-size:10px}</style><style>.portrait.person{position:relative;display:block;overflow:hidden;font-size:inherit;background:linear-gradient(145deg,#f9d69d,#f18776)}.portrait.person .halo{position:absolute;width:280px;height:280px;border-radius:50%;background:#fff1c9;left:calc(50% - 140px);top:115px}.silhouette-head{position:absolute;width:132px;height:145px;border-radius:52% 52% 43% 43%;background:var(--age-ink,#d54a52);left:calc(50% - 66px);top:160px;z-index:1}.silhouette-body{position:absolute;width:270px;height:185px;border-radius:135px 135px 0 0;background:v <script>
(()=>{
  const keys=['str','con','siz','dex','app','int','pow','edu','luck'];
  const label={str:'力量 / STR',con:'体质 / CON',siz:'体型 / SIZ',dex:'敏捷 / DEX',app:'外貌 / APP',int:'智力 / INT',pow:'意志 / POW',edu:'教育 / EDU',luck:'幸运 / LUCK'};
  const descriptions={str:[[15,'虚弱，孱弱'],[40,'力量弱小'],[60,'有正常人的力量'],[80,'超乎常人的力量'],[999,'超乎超乎常人的力量']],dex:[[20,'很不灵活'],[40,'不是很灵活'],[60,'普通人水平'],[80,'是一位运动健将'],[999,'高速而灵活，可以达成超凡技艺']],pow:[[20,'尔不过玩物'],[40,'痴愚盲目'],[60,'如常人一般会有一定自制力'],[80,'我心如铁，心坚石穿'],[100,'泰山崩于面而色不变'],[140,'钢铁之心，还能看见鬼'],[999,'你怕是个假人吧']],con:[[20,'常年患病在身'],[40,'体弱多病'],[60,'不会生什么大毛病'],[80,'健硕，浑身湿透也不会感冒'],[999,'身体素质极好，精神抖擞']],app:[[20,'用脸就能恐惧敌人'],[40,'有些难看'],[60,'人群之中不显眼'],[80,'五官端正，仪表堂堂'],[999,'沉鱼落雁，闭月羞花']],edu:[[20,'目不识丁'],[40,'小学毕业'],[60,'高中毕业'],[80,'重点大学学生或研究生'],[999,'饱读诗书，满腹经纶']],siz:[[20,'孩童，身短体瘦'],[40,'乙女身材'],[60,'普遍身高 155–175'],[80,'不是高就是胖'],[100,'大号的人'],[150,'正在申请身高世界记录'],[180,'你可能是一头牛'],[200,'历史上最重的人类'],[999,'过分了喂！']],int:[[20,'脑子是个好东西，可惜……'],[40,'理解知识更费时间'],[60,'有普通人的灵光一现'],[80,'可以自主进行发明创造'],[999,'天才级水准']],luck:[[20,'克夫克妻'],[40,'霉运连连'],[60,'命格平庸'],[80,'在马路边捡到 100 块'],[999,'被幸运女神眷顾']]};
  const describe=(key,value)=>(descriptions[key].find(item=>value<=item[0])||[0,'—'])[1];
  const $=s=>document.querySelector(s);
  let manualLuck=0;
  const spots={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  const die=n=>'<i class="die">'+spots[n].map(p=>'<b class="pip" style="grid-area:'+Math.ceil(p/3)+'/'+((p-1)%3+1)+'"></b>').join('')+'</i>';
  const rollD6=()=>1+Math.floor(Math.random()*6);
  const readValues=()=>Object.fromEntries(keys.map((key,index)=>{
    const el=document.querySelectorAll('#stats .stat')[index]?.querySelector('input,span');
    return [key,parseInt(el?.value||el?.textContent,10)||0];
  }));
  const saveValues=v=>localStorage.setItem('final',JSON.stringify(Object.fromEntries(keys.map(k=>[k,{value:v[k]}]))));
  const avatar=()=>'<div class="avatar-halo"></div><div class="avatar-figure" aria-label="调查员未定头像"><div class="avatar-body"></div><div class="avatar-neck"></div><div class="avatar-head"></div><div class="avatar-question">?</div></div><div class="portrait-age">AGE · '+$('#age').value+'</div>';
  const paintAvatar=host=>{
    const age=+$('#age').value;
    const r=Math.max(91,223-age*1.3),g=Math.max(27,86-age*.54),b=Math.max(38,91-age*.45);
    host.classList.remove('age-luck-side');
    host.classList.add('person','final-person');
    host.style.setProperty('--age-ink','rgb('+r+','+g+','+b+')');
    host.innerHTML=avatar();
  };

  function setupManualLuck(){
    const panel=$('#manual');
    if(!panel)return;
    let box=$('#manualLuckBox');
    if(!box){
      box=document.createElement('div');
      box.className='luck-roll';
      box.id='manualLuckBox';
      box.innerHTML='<b>幸运必须掷骰</b><small>LUCK · 3D6 × 5</small><div class="dice" id="manualLuckDice">'+[1,1,1].map(die).join('')+'</div><button type="button" id="rollManualLuck">掷幸运骰</button><span id="manualLuck">尚未掷骰</span>';
      panel.append(box);
      $('#rollManualLuck').onclick=rollManualLuck;
    }
    const input=$('#stats input[data-k="luck"]');
    if(input){
      input.readOnly=true;
      input.placeholder='请掷幸运';
      input.style.opacity='.72';
      if(manualLuck){input.value=manualLuck;input.dispatchEvent(new Event('input',{bubbles:true}))}
    }
  }
  function rollManualLuck(){
    const dice=[rollD6(),rollD6(),rollD6()];
    manualLuck=dice.reduce((sum,n)=>sum+n,0)*5;
    $('#manualLuckDice').innerHTML=dice.map(die).join('');
    $('#manualLuck').innerHTML='骰面 '+dice.join(' + ')+' → <b>'+manualLuck+'</b>';
    const input=$('#stats input[data-k="luck"]');
    if(input){input.value=manualLuck;input.dispatchEvent(new Event('input',{bubbles:true}))}
  }
  $('#manualBtn').addEventListener('click',()=>setTimeout(setupManualLuck,0));

  $('#confirm').onclick=()=>{
    const v=readValues();
    if($('#manual').classList.contains('on') && !manualLuck){alert('自主填写时，请先掷定幸运。');return}
    if(!Object.values(v).every(n=>n>0)){alert('请完成所有九项属性。');return}
    saveValues(v);
    startAgeFix(v);
  };

  function ageRule(age){
    if(age>=80)return {checks:4,physical:80,appearance:25,mov:5};
    if(age>=70)return {checks:4,physical:40,appearance:20,mov:4};
    if(age>=60)return {checks:4,physical:20,appearance:15,mov:3};
    if(age>=50)return {checks:3,physical:10,appearance:10,mov:2};
    if(age>=40)return {checks:2,physical:5,appearance:5,mov:1};
    if(age>=20)return {checks:1,physical:0,appearance:0,mov:0};
    return {checks:0,physical:0,appearance:0,mov:0};
  }

  function startAgeFix(v){
    go(3);
    const age=+$('#age').value;
    const rule=ageRule(age);
    let finalLuck=v.luck;
    let educationDone=rule.checks===0;
    const left=$('#s3 .portrait');
    paintAvatar(left);
    const right=$('#s3 .right');
    right.innerHTML='<span class="eyebrow">ATTRIBUTE FINALIZATION</span><h1>年龄修正</h1><p>年龄 '+age+' 岁。仅显示此年龄段需要处理的修正；完成后将生成衍生数值。</p><div id="fixes"></div><button class="btn" id="finishFix">完成修正，生成数值 →</button>';
    const fixes=$('#fixes');

    if(age>=15&&age<=19){
      fixes.innerHTML+='<div class="fix-card"><b>15–19 岁修正</b><br>STR 与 SIZ 合计减少 5：STR 扣 <input id="teenStr" value="0" type="number" min="0" max="5">，剩余从 SIZ 扣除。<br>EDU 固定减少 5。幸运须掷两次取高值，请在左侧重掷。</div>';
      left.classList.add('age-luck-side');
      left.innerHTML='<div class="age-luck"><span class="eyebrow">LUCK REROLL</span><h2>幸运重掷</h2><p>初始幸运：<b>'+v.luck+'</b></p><div class="dice" id="teenLuckDice">'+[1,1,1].map(die).join('')+'</div><button type="button" id="teenLuck">掷 3D6 × 5</button><p id="teenLuckLog">可保留初始值，或重掷后取较高值。</p></div>';
      $('#teenLuck').onclick=()=>{
        const dice=[rollD6(),rollD6(),rollD6()];
        const result=dice.reduce((sum,n)=>sum+n,0)*5;
        finalLuck=Math.max(v.luck,result);
        $('#teenLuckDice').innerHTML=dice.map(die).join('');
        $('#teenLuckLog').innerHTML='骰面 '+dice.join(' + ')+' → '+result+'；采用较高值 <b>'+finalLuck+'</b>';
      };
    }
    if(rule.physical){
      fixes.innerHTML+='<div class="fix-card"><b>体能减值</b><br>STR / CON / DEX 合计减少 '+rule.physical+'：STR 扣 <input id="fixStr" value="0" type="number" min="0">，CON 扣 <input id="fixCon" value="0" type="number" min="0">，剩余从 DEX 扣除。</div>';
    }
    if(rule.appearance){
      fixes.innerHTML+='<div class="fix-card"><b>外貌减值</b><br>APP 自动减少 '+rule.appearance+'。</div>';
    }
    if(rule.checks){
      fixes.innerHTML+='<div class="fix-card"><b>EDU 增强检定 × '+rule.checks+'</b><br>每次掷 D100；结果高于当前 EDU 时，EDU +1D10（最高 99）。<br><button type="button" id="eduRoll">进行 EDU 增强检定</button><span class="fixlog" id="eduLog"></span></div>';
      $('#eduRoll').onclick=()=>{
        const log=[];
        let education=v.edu;
        for(let i=0;i<rule.checks;i++){
          const d100=1+Math.floor(Math.random()*100);
          if(d100>education){
            const d10=1+Math.floor(Math.random()*10);
            const before=education;
            education=Math.min(99,education+d10);
            log.push((i+1)+'：'+d100+' ＞ '+before+'，+'+(education-before));
          }else log.push((i+1)+'：'+d100+' ≤ '+education+'，无提升');
        }
        v.edu=education;
        educationDone=true;
        $('#eduRoll').textContent='已完成 EDU 增强检定';
        $('#eduRoll').disabled=true;
        $('#eduLog').textContent=log.join('；');
      };
    }
    if(!fixes.innerHTML)fixes.innerHTML='<div class="fix-card">此年龄不需要额外修正。</div>';

    $('#finishFix').onclick=()=>{
      if(!educationDone){alert('请先完成 EDU 增强检定。');return}
      if(age>=15&&age<=19){
        const strLoss=+$('#teenStr').value;
        const sizLoss=5-strLoss;
        if(strLoss<0||strLoss>5||strLoss>v.str||sizLoss>v.siz){alert('STR / SIZ 的扣点无效。');return}
        v.str-=strLoss;
        v.siz-=sizLoss;
        v.edu=Math.max(0,v.edu-5);
        v.luck=finalLuck;
      }
      if(rule.physical){
        const strLoss=+$('#fixStr').value;
        const conLoss=+$('#fixCon').value;
        const dexLoss=rule.physical-strLoss-conLoss;
        if(strLoss<0||conLoss<0||dexLoss<0||strLoss>v.str||conLoss>v.con||dexLoss>v.dex){alert('请让 STR / CON / DEX 的扣点合计为 '+rule.physical+'，且每项不会降至 0 以下。');return}
        v.str-=strLoss;
        v.con-=conLoss;
        v.dex-=dexLoss;
      }
      if(rule.appearance)v.app=Math.max(0,v.app-rule.appearance);
      showFinal(v,rule.mov);
    };
  }

  function showFinal(v,movLoss){
    const hp=Math.floor((v.con+v.siz)/10);
    const mp=Math.floor(v.pow/5);
    const sum=v.str+v.siz;
    const db=sum<=64?'-2':sum<=84?'-1':sum<=124?'0':sum<=164?'+1D4':sum<=204?'+1D6':'+2D6';
    const build=sum<=64?-2:sum<=84?-1:sum<=124?0:sum<=164?1:sum<=204?2:3;
    const baseMove=v.str<v.siz&&v.dex<v.siz?7:(v.str>v.siz&&v.dex>v.siz?9:8);
    const mov=Math.max(1,baseMove-movLoss);
    const left=$('#s3 .portrait');

    saveValues(v);
  }
})();

(()=>{
  const attributeLabels={str:'力量',dex:'敏捷',app:'外貌',pow:'意志',con:'体质'};
  let selectedJobIndex=0;
  const readChoice=()=>{try{return JSON.parse(localStorage.getItem('occupationAttributeChoice')||'{}')}catch{return {}}};
  const saveChoice=choices=>localStorage.setItem('occupationAttributeChoice',JSON.stringify(choices));
  const value=(stats,key)=>Number(stats?.[key]?.value??stats?.[key]??0);
  const candidateKeys=formula=>Object.entries(attributeLabels).filter(([,label])=>formula.includes(label)).map(([key])=>key);
  const selectedKey=(profession,stats)=>{
    const candidates=candidateKeys(profession.formula||'');
    if(candidates.length<2)return candidates[0]||'';
    const saved=readChoice()[profession.id];
    return candidates.includes(saved)?saved:candidates.slice().sort((a,b)=>value(stats,b)-value(stats,a))[0];
  };
  const occupationPoints=(profession,stats)=>{
    const formula=profession.formula||'';
    if(profession.id===3)return value(stats,'edu')*2+value(stats,'dex')*2;
    if(formula.includes('教育×4'))return value(stats,'edu')*4;
    const key=selectedKey(profession,stats);
    return formula.includes('教育×2')?value(stats,'edu')*2+value(stats,key)*2:0;
  };
  const optionControl=(profession,stats)=>{
    const candidates=candidateKeys(profession.formula||'');
    if(candidates.length<2)return '';
    const chosen=selectedKey(profession,stats);
    return '<label class="occupation-point-choice">职业点计算属性<select id="occupationAttributeChoice">'+candidates.map(key=>'<option value="'+key+'" '+(key===chosen?'selected':'')+'>'+attributeLabels[key]+' '+value(stats,key)+'（合计 '+(value(stats,'edu')*2+value(stats,key)*2)+'）</option>').join('')+'</select></label>';
  };
  window.setOccupationAttributeChoice=(id,key)=>{const choices=readChoice();choices[id]=key;saveChoice(choices);window.jobs()};
  window.jobs=()=>{
    const stats=JSON.parse(localStorage.getItem('final')||'{}');
    const draw=query=>{
      const list=PROFESSIONS.filter(item=>(item.name+item.id).includes(query));
      const current=PROFESSIONS[selectedJobIndex]||PROFESSIONS[0];
      jobrows.innerHTML=list.map(item=>'<tr class="'+(item.id===current.id?'on':'')+'" onclick="choose('+item.id+')"><td>'+item.id+'</td><td>'+item.name+'</td><td>'+item.creditMin+'–'+item.creditMax+'</td><td>'+occupationPoints(item,stats)+'</td></tr>').join('');
      const profession=PROFESSIONS[selectedJobIndex]||PROFESSIONS[0],chips=profession.skills.split('，').filter(Boolean);
      jobdetail.innerHTML='<span class="eyebrow">OCCUPATION PROFILE</span><h1>'+profession.id+' · '+profession.name+'</h1><div class="metrics"><div><small>信誉范围</small><b>'+profession.creditMin+'–'+profession.creditMax+'</b></div><div><small>职业属性点</small><b>'+profession.formula+'</b></div><div><small>当前可用点数</small><b>'+occupationPoints(profession,stats)+'</b></div></div>'+optionControl(profession,stats)+'<h2>本职技能</h2><div class="chips">'+chips.map(item=>'<span>'+item+'</span>').join('')+'</div><p>'+profession.skills+'</p>';
      const select=document.querySelector('#occupationAttributeChoice');
      if(select)select.onchange=event=>window.setOccupationAttributeChoice(profession.id,event.target.value);
    };
    window.choose=id=>{selectedJobIndex=PROFESSIONS.findIndex(item=>item.id===id);draw(search.value)};
    search.oninput=()=>draw(search.value);
    draw(search.value||'');
  };
})();
</script></body></html>
